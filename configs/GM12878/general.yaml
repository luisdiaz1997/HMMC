name: GM12878_chr19
seed: 67
dataset: GM12878_hg38_25kb
output_dir: outputs

preprocessing:
  mcool_path: mcools/4DNFIXP4QG5B.mcool
  resolution: 25000
  fasta_path: /gladstone/engelhardt/lab/lchumpitaz/hi-c/hg38.fa
  chromosomes: ['chr19']
  n_eigs: 3
  clip_percentile: 99
  ignore_diags: 2

segmentation:
