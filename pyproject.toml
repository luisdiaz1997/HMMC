[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HMMC"
version = "0.1.0"
description = "HMM segmentation of Hi-C compartments"
readme = "README.md"
license = {text = "GPL-2.0-only"}
authors = [
    {name = "Luis Chumpitaz Diaz", email = "luis.chumpitazdiaz@gladstone.ucsf.edu"},
]
keywords = [
    "chromatin",
    "hi-c",
    "compartments",
    "hidden-markov-models",
    "segmentation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "bioframe>=0.4.0",
    "hmmlearn>=0.3.0",
    "cooler>=0.9.0",
    "cooltools>=0.7.0",
    "click>=8.0",
    "pyyaml>=6.0",
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
]

[project.scripts]
hmmc = "HMMC.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "isort>=5.10.0",
]

[project.urls]
Homepage = "https://github.com/luisdiaz1997/HMMC"
Repository = "https://github.com/luisdiaz1997/HMMC"

[tool.setuptools.packages.find]
include = ["HMMC*"]
